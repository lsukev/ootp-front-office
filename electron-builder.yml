appId: com.lsukev.ootpfrontoffice
productName: OOTP Front Office
copyright: Copyright © 2026 Kevin Ivy

directories:
  output: release
  buildResources: build

# Artifact names must not contain spaces. The release job uploads with
# `gh release upload`, and GitHub rewrites spaces to dots in asset names —
# so "OOTP Front Office-0.2.0.zip" becomes "OOTP.Front.Office-0.2.0.zip" on
# the release while latest-mac.yml still points at the original name, and
# every update download 404s. Naming from ${name} keeps the local file, the
# published asset, and the manifest entry byte-identical.
artifactName: ${name}-${version}-${arch}.${ext}

files:
  - build/main.cjs
  - build/main.cjs.map
  - build/preload.cjs
  - package.json

# The built frontend lives outside the asar archive so Express can serve it
# from a real path, and so APP_ROOT (= resourcesPath) resolves ./dist.
extraResources:
  - from: dist
    to: dist

# Native modules cannot be loaded from inside an asar archive
asarUnpack:
  - node_modules/better-sqlite3/**

mac:
  category: public.app-category.sports
  target:
    # dmg is what people download by hand; zip is what Squirrel.Mac needs to
    # apply an in-place update — it cannot install from a dmg. Both must be
    # published or auto-update silently fails on macOS.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing and notarization are picked up from environment variables in CI
  # (CSC_LINK / CSC_KEY_PASSWORD, APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID). Builds run fine unsigned when they are absent.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: ${productName}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: OOTP Front Office

linux:
  target: [AppImage]
  category: Game

publish:
  provider: github
  releaseType: release
